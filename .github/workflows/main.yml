import os
import sys
import json
import subprocess
from datetime import datetime, timedelta
from PyQt5.QtWidgets import (QApplication, QMainWindow, QWidget, QVBoxLayout, QHBoxLayout,
                             QPushButton, QLabel, QSlider, QLineEdit, QTextEdit, QFileDialog,
                             QGroupBox, QFormLayout, QCheckBox)
from PyQt5.QtCore import Qt, QTimer

CONFIG_PATH = "player_config.json"
WARM_STYLE = """
QMainWindow {background-color: #FFF5E6;}
QWidget {background-color: #FFF5E6; font-family: "微软雅黑"; font-size:10pt; color:#693710;}
QGroupBox {
    border:2px solid #FFBC80;
    border-radius:8px;
    margin-top:8px;
    padding-top:12px;
    color:#7a3e0c;
    font-weight:bold;
}
QGroupBox::title {subcontrol-origin: margin; left:10px;}
QPushButton {
    background-color:#FFA960;
    color:#492808;
    border:none;
    border-radius:6px;
    padding:7px 0;
}
QPushButton:hover {background-color:#FF9038;}
QLineEdit {
    border:1px solid #FFC998;
    border-radius:4px;
    background:#FFFAF0;
    padding:4px;
}
QTextEdit {
    border:1px solid #FFC998;
    border-radius:4px;
    background:#FFFAF0;
}
QSlider::groove:horizontal {
    background:#FFDDBB;
    height:8px;
    border-radius:4px;
}
QSlider::handle:horizontal {
    background:#FF8530;
    width:16px;
    height:16px;
    border-radius:8px;
    margin:-4px 0;
}
QCheckBox {color:#65320e;}
"""

class WarmPlayer(QMainWindow):
    def __init__(self):
        super().__init__()
        self.setWindowTitle("暖色调定时音频播放器")
        self.resize(690, 600)
        self.setStyleSheet(WARM_STYLE)

        self.ff_proc = None
        self.cur_idx = 0
        self.music_list = []
        self.loop_flag = False
        self.cur_volume = 80
        self.is_paused = False
        self.manual_mode = False  # 程序启动永远重置为False，取消上次停止锁定

        # 定时器
        self.timer_check = QTimer()
        self.timer_check.timeout.connect(self.check_time_task)
        self.timer_check.start(1000)

        self.info_timer = QTimer()
        self.info_timer.timeout.connect(self.refresh_song_info)
        self.info_timer.start(2500)

        self.end_check_timer = QTimer()
        self.end_check_timer.timeout.connect(self.check_music_end)
        self.end_check_timer.start(600)

        self.cfg = self.load_cfg()
        self.build_ui()

        # 1.读取保存路径、加载歌曲（固定顺序）
        folder = self.cfg.get("folder_path", "")
        if os.path.isdir(folder):
            self.inp_path.setText(folder)
            self.load_music_folder(folder)

        # 加载配置参数
        self.cb_loop.setChecked(self.cfg.get("loop", False))
        self.loop_flag = self.cb_loop.isChecked()

        vol = self.cfg.get("volume", 80)
        self.slider_vol.setValue(vol)
        self.cur_volume = vol

        self.inp_st_h.setText(self.cfg.get("start_h", "08"))
        self.inp_st_m.setText(self.cfg.get("start_m", "00"))
        self.inp_st_s.setText(self.cfg.get("start_s", "00"))
        self.inp_ed_h.setText(self.cfg.get("end_h", "18"))
        self.inp_ed_m.setText(self.cfg.get("end_m", "00"))
        self.inp_ed_s.setText(self.cfg.get("end_s", "00"))

        time_edits = [self.inp_st_h, self.inp_st_m, self.inp_st_s, self.inp_ed_h, self.inp_ed_m, self.inp_ed_s]
        for ed in time_edits:
            ed.editingFinished.connect(self.save_current_config)

        # 2.延迟执行定时判断：已加载完歌曲，在时间段就自动播放
        QTimer.singleShot(400, self.check_time_task)

    def build_ui(self):
        center = QWidget()
        self.setCentralWidget(center)
        main_layout = QVBoxLayout(center)
        main_layout.setSpacing(11)
        main_layout.setContentsMargins(14, 14, 14, 14)

        # 文件夹
        g_folder = QGroupBox("音频文件夹路径")
        lay_f = QHBoxLayout(g_folder)
        self.inp_path = QLineEdit()
        self.inp_path.setPlaceholderText("粘贴文件夹路径或点按钮选择")
        btn_sel = QPushButton("浏览选择")
        btn_sel.clicked.connect(self.select_dir)
        lay_f.addWidget(self.inp_path)
        lay_f.addWidget(btn_sel)
        main_layout.addWidget(g_folder)

        # 播放清单
        g_list = QGroupBox("播放清单")
        lay_list = QVBoxLayout(g_list)
        self.text_list = QTextEdit()
        self.text_list.setReadOnly(True)
        lay_list.addWidget(self.text_list)
        main_layout.addWidget(g_list)

        # 两个按钮：播放/暂停 + 停止
        lay_btn = QHBoxLayout()
        self.btn_play_pause = QPushButton("▶ 播放")
        self.btn_stop = QPushButton("■ 停止")
        self.btn_play_pause.clicked.connect(self.play_pause)
        self.btn_stop.clicked.connect(self.stop)
        lay_btn.addWidget(self.btn_play_pause)
        lay_btn.addWidget(self.btn_stop)
        main_layout.addLayout(lay_btn)

        # 音量
        lay_vol = QHBoxLayout()
        lay_vol.addWidget(QLabel("音量"))
        self.slider_vol = QSlider(Qt.Horizontal)
        self.slider_vol.setRange(0, 100)
        self.slider_vol.setValue(80)
        self.slider_vol.valueChanged.connect(self.set_vol)
        self.lab_vol = QLabel("80")
        lay_vol.addWidget(self.slider_vol)
        lay_vol.addWidget(self.lab_vol)
        main_layout.addLayout(lay_vol)

        # 循环
        self.cb_loop = QCheckBox("开启整列表循环播放")
        self.cb_loop.stateChanged.connect(self.switch_loop)
        main_layout.addWidget(self.cb_loop)

        # 定时
        g_time = QGroupBox("定时区间 | 时:分:秒")
        lay_time = QFormLayout(g_time)
        lay_start = QHBoxLayout()
        self.inp_st_h = QLineEdit()
        self.inp_st_m = QLineEdit()
        self.inp_st_s = QLineEdit()
        lay_start.addWidget(self.inp_st_h)
        lay_start.addWidget(QLabel("时"))
        lay_start.addWidget(self.inp_st_m)
        lay_start.addWidget(QLabel("分"))
        lay_start.addWidget(self.inp_st_s)
        lay_start.addWidget(QLabel("秒"))
        lay_time.addRow("开始播放:", lay_start)

        lay_end = QHBoxLayout()
        self.inp_ed_h = QLineEdit()
        self.inp_ed_m = QLineEdit()
        self.inp_ed_s = QLineEdit()
        lay_end.addWidget(self.inp_ed_h)
        lay_end.addWidget(QLabel("时"))
        lay_end.addWidget(self.inp_ed_m)
        lay_end.addWidget(QLabel("分"))
        lay_end.addWidget(self.inp_ed_s)
        lay_end.addWidget(QLabel("秒"))
        lay_time.addRow("结束播放:", lay_end)
        main_layout.addWidget(g_time)

        # 保存配置按钮
        self.btn_save = QPushButton("💾 保存当前所有配置")
        self.btn_save.clicked.connect(self.save_current_config)
        main_layout.addWidget(self.btn_save)

        # 播放信息
        info_group = QGroupBox("播放信息")
        info_lay = QVBoxLayout(info_group)
        self.lab_now = QLabel("当前曲目：无")
        self.lab_next = QLabel("下一首曲目：无")
        info_lay.addWidget(self.lab_now)
        info_lay.addWidget(self.lab_next)
        main_layout.addWidget(info_group)

        self.lab_status = QLabel("● 待机就绪")
        main_layout.addWidget(self.lab_status)

    def refresh_song_info(self):
        cnt = len(self.music_list)
        if cnt <= 0 or self.ff_proc is None or self.ff_proc.poll() is not None:
            self.lab_now.setText("当前曲目：无")
            self.lab_next.setText("下一首曲目：无")
            return

        now_name = os.path.basename(self.music_list[self.cur_idx])
        next_idx = self.cur_idx + 1
        if next_idx >= cnt:
            next_idx = 0 if self.loop_flag else -1
        next_name = os.path.basename(self.music_list[next_idx]) if next_idx >= 0 else "无"

        self.lab_now.setText(f"当前曲目：{now_name}")
        self.lab_next.setText(f"下一首曲目：{next_name}")

    def select_dir(self):
        path = QFileDialog.getExistingDirectory(self, "选取音乐文件夹")
        if path:
            self.inp_path.setText(path)
            self.load_music_folder(path)
            self.save_current_config()

    def load_music_folder(self, path):
        self.stop()
        self.music_list.clear()
        self.text_list.clear()
        self.cur_idx = 0
        suffix = (".mp3", ".wav", ".flac", ".ogg", ".m4a")
        try:
            all_file = sorted([i for i in os.listdir(path) if i.lower().endswith(suffix)])
        except:
            all_file = []
        if not all_file:
            self.lab_status.setText("● 目录没有可播放音频")
            return
        for name in all_file:
            self.music_list.append(os.path.join(path, name))
            self.text_list.append(name)
        self.cfg["folder_path"] = path
        self.lab_status.setText(f"● 成功载入 {len(all_file)} 首音频")

    def play_pause(self):
        self.manual_mode = False
        if not self.music_list:
            self.lab_status.setText("● 请先载入音乐文件夹")
            return
        if self.ff_proc is None:
            self.play()
            self.btn_play_pause.setText("⏸ 暂停")
        else:
            if self.is_paused:
                self.resume()
                self.btn_play_pause.setText("⏸ 暂停")
            else:
                self.pause()
                self.btn_play_pause.setText("▶ 继续")

    def play(self):
        self.stop()
        if not self.music_list:
            return
        path = self.music_list[self.cur_idx]
        cmd = [
            "ffplay.exe",
            "-nodisp",
            "-autoexit",
            "-volume", str(self.cur_volume),
            path
        ]
        try:
            self.ff_proc = subprocess.Popen(
                cmd,
                stdout=subprocess.PIPE,
                stderr=subprocess.PIPE,
                creationflags=subprocess.CREATE_NO_WINDOW
            )
            self.is_paused = False
            self.btn_play_pause.setText("⏸ 暂停")
            self.lab_status.setText("● 正在播放")
        except Exception as e:
            self.lab_status.setText("❌ 找不到ffplay.exe，请放到程序同目录")

    def pause(self):
        if self.ff_proc and not self.is_paused:
            subprocess.run(["taskkill", "/f", "/pid", str(self.ff_proc.pid)], creationflags=subprocess.CREATE_NO_WINDOW)
            self.is_paused = True
            self.lab_status.setText("● 已暂停")

    def resume(self):
        self.is_paused = False
        self.play()
        self.lab_status.setText("● 正在播放")

    def stop(self):
        self.manual_mode = True
        self.is_paused = False
        self.btn_play_pause.setText("▶ 播放")
        if self.ff_proc:
            try:
                self.ff_proc.terminate()
                self.ff_proc.wait(timeout=0.3)
            except:
                pass
        try:
            subprocess.run(["taskkill", "/f", "/im", "ffplay.exe"], creationflags=subprocess.CREATE_NO_WINDOW)
        except:
            pass
        self.ff_proc = None
        self.lab_status.setText("● 已停止（手动锁定定时）")

    def check_music_end(self):
        if self.ff_proc is None:
            return
        if self.ff_proc.poll() is not None:
            total = len(self.music_list)
            if total == 0:
                self.stop()
                return
            self.cur_idx += 1
            if self.cur_idx >= total:
                if self.loop_flag:
                    self.cur_idx = 0
                else:
                    self.stop()
                    return
            self.play()

    def set_vol(self, val):
        self.cur_volume = val
        self.lab_vol.setText(str(val))
        self.cfg["volume"] = val

    def switch_loop(self):
        self.loop_flag = self.cb_loop.isChecked()
        self.cfg["loop"] = self.loop_flag

    def save_current_config(self):
        self.cfg["start_h"] = self.inp_st_h.text().strip()
        self.cfg["start_m"] = self.inp_st_m.text().strip()
        self.cfg["start_s"] = self.inp_st_s.text().strip()
        self.cfg["end_h"] = self.inp_ed_h.text().strip()
        self.cfg["end_m"] = self.inp_ed_m.text().strip()
        self.cfg["end_s"] = self.inp_ed_s.text().strip()
        self.cfg["volume"] = self.cur_volume
        self.cfg["loop"] = self.loop_flag
        with open(CONFIG_PATH, "w", encoding="utf-8") as f:
            json.dump(self.cfg, f, ensure_ascii=False, indent=3)
        self.lab_status.setText("✅ 所有配置已保存！")

    def check_time_task(self):
        if self.manual_mode:
            return
        try:
            sh = self.inp_st_h.text().strip()
            sm = self.inp_st_m.text().strip()
            ss = self.inp_st_s.text().strip()
            eh = self.inp_ed_h.text().strip()
            em = self.inp_ed_m.text().strip()
            es = self.inp_ed_s.text().strip()
            h1, m1, s1 = int(sh), int(sm), int(ss)
            h2, m2, s2 = int(eh), int(em), int(es)

            now = datetime.now()
            t_start = now.replace(hour=h1, minute=m1, second=s1)
            t_end = now.replace(hour=h2, minute=m2, second=s2)
            if t_end <= t_start:
                t_end += timedelta(days=1)

            in_time = t_start <= now <= t_end
            playing = self.ff_proc is not None and self.ff_proc.poll() is None

            # 在时段+有歌曲+没播放 →自动启动
            if in_time and not playing and len(self.music_list) > 0:
                self.play()
        except:
            pass

    def load_cfg(self):
        if os.path.exists(CONFIG_PATH):
            with open(CONFIG_PATH, "r", encoding="utf-8") as f:
                return json.load(f)
        return {}

    def closeEvent(self, e):
        self.stop()
        self.save_current_config()
        e.accept()

if __name__ == "__main__":
    app = QApplication(sys.argv)
    win = WarmPlayer()
    win.show()
    sys.exit(app.exec_())
