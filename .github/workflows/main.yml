name: Build EXE
on: push
jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 解决Node.js 20警告
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 pyinstaller

      - name: Build single exe
        run: |
          # 重点：把下面的文件名改成你仓库里实际的Python文件名（复制粘贴！）
          pyinstaller -F "1时段定时播放器.py" --hidden-import PyQt5.sip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 定时播放器成品EXE
          path: dist/*.exe
